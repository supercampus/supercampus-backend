services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supercampus_control
      POSTGRES_USER: supercampus
      POSTGRES_PASSWORD: supercampus-local
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supercampus -d supercampus_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  provision:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["supercampus-migration-runner"]
    command: ["provision", "tenant-local", "supercampus_tenant_local"]
    environment:
      CONTROL_DATABASE_URL: postgresql://supercampus:supercampus-local@postgres:5432/supercampus_control
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 4000
      CONTROL_DATABASE_URL: postgresql://supercampus:supercampus-local@postgres:5432/supercampus_control
      JWT_SECRET: replace-with-at-least-32-random-characters
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RUST_LOG: info
    ports: ["4000:4000"]
    depends_on:
      provision:
        condition: service_completed_successfully

volumes:
  postgres-data:
